<!-- Hand-authored inline SVG symbol sprite, defined once, referenced via
     <use> from the post-index cards. Not generated, not a photo — plain
     CAD/patent-style linework matching the register D3's Media Grammar (a)
     names as the one non-photographic line type the system actually allows.
     Three variants cycle across index cards for visual variety without any
     borrowed or generated artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute; width:0; height:0; overflow:hidden" aria-hidden="true" focusable="false">
  <symbol id="artifact-graph" viewBox="0 0 48 48">
    <path d="M10 12 L24 8 M24 8 L38 16 M10 12 L16 30 M16 30 L34 36 M24 8 L34 36" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2"/>
    <circle cx="10" cy="12" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <circle cx="24" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <circle cx="38" cy="16" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <circle cx="16" cy="30" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <circle cx="34" cy="36" r="2.6" class="artifact-accent" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="artifact-diagram" viewBox="0 0 48 48">
    <rect x="4" y="6" width="40" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <path d="M8 14 L8 22 L20 22 L20 30" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <path d="M28 14 L28 30 L40 30 L40 38" fill="none" stroke="currentColor" stroke-width="1.4" class="artifact-accent-stroke"/>
    <circle cx="20" cy="30" r="1.6" fill="currentColor"/>
    <circle cx="40" cy="38" r="1.8" class="artifact-accent" fill="currentColor"/>
  </symbol>
  <!-- Social marks for the footer. Deliberately line-art at stroke-width 1.3,
       not brand glyphs: they sit beside their own text labels, so they don't
       have to carry recognition alone, and this keeps them in the same
       CAD/patent register as the artifact marks above. GitHub is a git-branch
       figure (nodes + connectors) rather than the octocat for that reason. -->
  <symbol id="social-email" viewBox="0 0 16 16">
    <rect x="1.2" y="3.2" width="13.6" height="9.6" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <path d="M1.8 4 L8 9 L14.2 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="social-github" viewBox="0 0 16 16">
    <circle cx="4.5" cy="3.6" r="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <circle cx="4.5" cy="12.4" r="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <circle cx="11.5" cy="5.4" r="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <path d="M4.5 5.2 L4.5 10.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M11.5 7 C11.5 9.6 8.6 9.2 6 11.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  </symbol>
  <symbol id="social-instagram" viewBox="0 0 16 16">
    <rect x="2" y="2" width="12" height="12" rx="3.4" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <circle cx="8" cy="8" r="2.9" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <circle cx="11.7" cy="4.3" r="0.85" fill="currentColor"/>
  </symbol>
  <symbol id="social-linkedin" viewBox="0 0 16 16">
    <rect x="1.6" y="1.6" width="12.8" height="12.8" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <circle cx="4.7" cy="4.9" r="0.95" fill="currentColor"/>
    <path d="M4.7 7 L4.7 11.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M7.5 11.5 L7.5 7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M7.5 8.9 C7.5 7.7 8.3 7 9.4 7 C10.5 7 11.3 7.8 11.3 9 L11.3 11.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  </symbol>
  <symbol id="social-rss" viewBox="0 0 16 16">
    <circle cx="4" cy="12" r="1.5" fill="currentColor"/>
    <path d="M3 8.2 A4.8 4.8 0 0 1 7.8 13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M3 4.2 A8.8 8.8 0 0 1 11.8 13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  </symbol>
  <symbol id="social-link" viewBox="0 0 16 16">

  <symbol id="artifact-terminal" viewBox="0 0 48 48">
    <rect x="3" y="6" width="42" height="36" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <path d="M9 16 L14 20 L9 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="artifact-accent-stroke"/>
    <line x1="19" y1="24" x2="30" y2="24" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" class="artifact-accent-stroke"/>
    <line x1="9" y1="32" x2="34" y2="32" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="9" y1="36" x2="26" y2="36" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>
</svg>
